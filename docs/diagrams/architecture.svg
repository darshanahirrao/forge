  <path d="M207 1420 V1454 M474 1420 V1454 M740 1420 V1454 M1006 1420 V1454 M1273 1420 V1454 M207 1454 H1273" fill="none" stroke="#4E666E" stroke-width="2"/>
  <path class="edge" d="M740 1454 V1488"/>
  <rect class="panel" x="72" y="1488" width="1336" height="156" rx="6"/>
  <text class="label" x="100" y="1524">EXISTING NATIVE EXECUTION</text>
  <text class="heading" x="100" y="1565">Harnesses and their configured hosts.</text>
  <text class="small" x="100" y="1604">Browser / computer use, terminals, file tools, skills, workers. Supplied by connected runtimes.</text>

  <path d="M1408 1568 H1440 V976 H1380" fill="none" stroke="#12665F" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#return-arrow)"/>
  <text class="small teal" x="1465" y="1458" transform="rotate(-90 1465 1458)">Events, receipts, usage, resources</text>

  <text class="small" x="72" y="1694">Reuse native capabilities. Continue at verified checkpoints. Controls depend on supported interfaces.</text>
  <text class="small" x="72" y="1730">Design proposal. Runtime, integrations, accounting, and migration remain to be implemented.</text>
</svg>
