<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1760" viewBox="0 0 1480 1760" role="img" aria-labelledby="title description">
  <title id="title">Forge: Persistent Agency architecture</title>
  <desc id="description">Proposed architecture. The Forge workspace, paired phone, and connected channels access a persistent control plane. A replaceable agent runtime, such as Hermes or OpenClaw, works beside a deterministic Forge core and durable memory. Forge retains identity, workspace, work checkpoints, resource admission, approvals, and token and dollar accounting when components change. A versioned registry supports runtime, harness, model, memory, tool, skill, channel, and host adapters. Hermes, OpenClaw, Codex, Claude Code, OpenCode, and other compatible engines connect to local or optional remote workers. Events, receipts, usage, and resource measurements return to the journal. All capabilities shown are design proposals.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#4E666E" stroke-width="1.6" stroke-linejoin="round"/>
    </marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#12665F" stroke-width="1.6" stroke-linejoin="round"/>
    </marker>
    <style>
      text {font-family:"Avenir Next", Avenir, "Segoe UI", sans-serif; fill:#18343E; font-size:24px; font-weight:400}
      .brand {font-size:60px; font-weight:600; letter-spacing:3px}
      .concept {font-size:35px; font-weight:500}
      .label {font-size:18px; letter-spacing:1.8px; font-weight:500; fill:#4E666E}
      .heading {font-size:29px; font-weight:600}
      .small {font-size:22px; fill:#4E666E}
      .muted {fill:#4E666E}
      .white {fill:#FFFFFF}
      .white-muted {fill:#D4E8E7}
      .teal {fill:#12665F}
      .panel {fill:#FFFFFF; stroke:#B6C9CE; stroke-width:1.5}
      .edge {fill:none; stroke:#4E666E; stroke-width:2; marker-end:url(#arrow)}
      .pair {fill:none; stroke:#4E666E; stroke-width:2; marker-start:url(#arrow); marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1480" height="1760" fill="#F3F7F7"/>
  <text class="brand" x="72" y="106">FORGE</text>
  <text class="label" x="1408" y="82" text-anchor="end">ARCHITECTURE PROPOSAL</text>
  <text class="small" x="1408" y="116" text-anchor="end">16 October 2026</text>
  <text class="concept" x="72" y="162">Persistent Agency</text>
  <text class="muted" x="72" y="204">Your work survives your tools.</text>

  <rect class="panel" x="72" y="252" width="1336" height="148" rx="8"/>
  <text class="label" x="100" y="286">ONE AGENTIC WORKSPACE</text>
  <text class="heading" x="100" y="332">Forge workspace</text>
  <text class="small" x="100" y="364">Chat, editor, Git, terminal, browser</text>
  <text class="heading" x="614" y="332">Paired phone</text>
  <text class="small" x="614" y="368">Approvals and decisions</text>
  <text class="heading" x="1032" y="332">Connected channels</text>
  <text class="small" x="1032" y="368">Conversation and alerts</text>
  <path class="edge" d="M740 400 V484"/>
  <text class="small" x="768" y="451">Authenticated intent and decisions</text>

  <rect x="72" y="484" width="1336" height="558" rx="8" fill="none" stroke="#B6C9CE" stroke-width="1.5"/>
  <text class="label" x="100" y="524">PERSISTENT CONTROL PLANE</text>

  <rect class="panel" x="100" y="556" width="350" height="344" rx="6"/>
  <text class="heading teal" x="124" y="602">Agent runtime</text>
  <text x="124" y="650">Hermes / OpenClaw / others</text>
  <text x="124" y="692">Conversation + planning</text>
  <text x="124" y="734">Skills, tools, and channels</text>
  <text x="124" y="776">Scoped memory recall</text>
  <text class="small" x="124" y="838">Replaceable through a</text>
  <text class="small" x="124" y="870">versioned runtime adapter</text>

  <rect x="486" y="556" width="438" height="344" rx="6" fill="#18343E"/>
  <text class="heading white" x="514" y="602">Forge core</text>
  <text class="white-muted" x="514" y="646">Identity + work checkpoints</text>
  <text class="white-muted" x="514" y="688">Scheduling + resource admission</text>
  <text class="white-muted" x="514" y="730">Approval policy + action receipts</text>
  <text class="white-muted" x="514" y="772">Token + dollar ledger</text>
  <text class="small white" x="514" y="838">Deterministic. Recoverable.</text>
  <text class="small white" x="514" y="870">Operates without an LLM.</text>

  <rect class="panel" x="960" y="556" width="420" height="344" rx="6"/>
  <text class="heading" x="986" y="602">Durable memory</text>
  <text x="986" y="650">Facts, decisions, procedures</text>
  <text x="986" y="692">Sources, versions, corrections</text>
  <text x="986" y="734">Project-scoped retrieval</text>
  <text x="986" y="776">Portable work evidence</text>
  <text class="small" x="986" y="838">Pluggable memory providers</text>
  <text class="small" x="986" y="870">User-owned data and export</text>

  <path class="pair" d="M450 713 H486"/>
  <path class="pair" d="M924 713 H960"/>
  <path class="pair" d="M705 900 V936"/>
  <rect x="100" y="936" width="1280" height="78" rx="5" fill="#E4EEEE"/>
  <text x="128" y="970" font-weight="500">Durable journal + local artifacts</text>
  <text class="small" x="128" y="998">Profiles, shared tools and skills, schedules, work IDs, artifacts, approvals, usage provenance</text>

  <path class="edge" d="M740 1042 V1122"/>
  <text class="small" x="768" y="1090">Admitted work + scoped grants</text>
  <rect class="panel" x="72" y="1122" width="1336" height="120" rx="6"/>
  <text class="heading" x="100" y="1164">Versioned component registry</text>
  <text class="small" x="100" y="1206">Runtimes, harnesses, models, memory, tools, skills, channels, hosts. Capability checks + native extensions.</text>

  <path d="M740 1242 V1278 M207 1278 H1273" fill="none" stroke="#4E666E" stroke-width="2"/>
  <path class="edge" d="M207 1278 V1312"/>
  <path class="edge" d="M474 1278 V1312"/>
  <path class="edge" d="M740 1278 V1312"/>
  <path class="edge" d="M1006 1278 V1312"/>
  <path class="edge" d="M1273 1278 V1312"/>

  <rect class="panel" x="72" y="1312" width="254" height="108" rx="6"/>
  <text class="heading teal" x="96" y="1355">Agent runtimes</text>
  <text class="small" x="96" y="1394">Hermes / OpenClaw</text>
  <rect class="panel" x="342" y="1312" width="254" height="108" rx="6"/>
  <text class="heading" x="366" y="1355">Codex</text>
  <text class="small" x="366" y="1394">App-server</text>
  <rect class="panel" x="612" y="1312" width="254" height="108" rx="6"/>
  <text class="heading" x="636" y="1355">Claude Code</text>
  <text class="small" x="636" y="1394">Agent SDK</text>
  <rect class="panel" x="882" y="1312" width="254" height="108" rx="6"/>
  <text class="heading" x="906" y="1355">OpenCode</text>
  <text class="small" x="906" y="1394">Server API</text>
  <rect class="panel" x="1152" y="1312" width="256" height="108" rx="6"/>
  <text class="heading" x="1176" y="1355">Other harnesses</text>
  <text class="small" x="1176" y="1394">ACP / native adapter</text>

  <path d="M207 1420 V1454 M474 1420 V1454 M740 1420 V1454 M1006 1420 V1454 M1273 1420 V1454 M207 1454 H1273" fill="none" stroke="#4E666E" stroke-width="2"/>
  <path class="edge" d="M740 1454 V1488"/>
  <rect class="panel" x="72" y="1488" width="1336" height="156" rx="6"/>
  <text class="label" x="100" y="1524">EXECUTION WORKERS</text>
  <text class="heading" x="100" y="1565">Laptop first. Optional server or VM.</text>
  <text class="small" x="100" y="1604">Owned processes, browsers, workspaces, API calls. Enforcement at supported execution boundaries.</text>

  <path d="M1408 1568 H1440 V976 H1380" fill="none" stroke="#12665F" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#return-arrow)"/>
  <text class="small teal" x="1465" y="1458" transform="rotate(-90 1465 1458)">Events, receipts, usage, resources</text>

  <text class="small" x="72" y="1694">Switch at verified checkpoints. Controls depend on adapter capabilities and actual enforcement.</text>
  <text class="small" x="72" y="1730">Design proposal. Runtime, integrations, accounting, and migration remain to be implemented.</text>
</svg>
