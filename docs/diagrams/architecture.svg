<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1760" viewBox="0 0 1480 1760" role="img" aria-labelledby="title description">
  <title id="title">Forge: Persistent Agency architecture</title>
  <desc id="description">Proposed architecture. Forge supplies a control surface and durable cross-runtime coordination. Replaceable runtimes such as Hermes and OpenClaw supply their existing capabilities, alongside native Codex, Claude Code, OpenCode and other harnesses. Multiple native account slots bind to the same durable work through verified continuation, with scoped routes, identity checks and native quota evidence. Existing memory providers retain storage and retrieval. Browser and computer use, terminals, file tools, skills, native scheduling, execution permissions and configured hosts remain implemented by connected runtimes and providers. Forge retains identity, work checkpoints, references, approval receipts, resource ownership and usage accounting. It builds adapters and continuity without rebuilding native capability stacks. All Forge functionality shown remains a design proposal.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#4E666E" stroke-width="1.6" stroke-linejoin="round"/>
    </marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#12665F" stroke-width="1.6" stroke-linejoin="round"/>
    </marker>
    <style>
      text {font-family:"Avenir Next", Avenir, "Segoe UI", sans-serif; fill:#18343E; font-size:24px; font-weight:400}
      .brand {font-size:60px; font-weight:600; letter-spacing:3px}
      .concept {font-size:35px; font-weight:500}
      .label {font-size:18px; letter-spacing:1.8px; font-weight:500; fill:#4E666E}
      .heading {font-size:29px; font-weight:600}
      .small {font-size:22px; fill:#4E666E}
      .muted {fill:#4E666E}
      .white {fill:#FFFFFF}
      .white-muted {fill:#D4E8E7}
      .teal {fill:#12665F}
      .panel {fill:#FFFFFF; stroke:#B6C9CE; stroke-width:1.5}
      .edge {fill:none; stroke:#4E666E; stroke-width:2; marker-end:url(#arrow)}
      .pair {fill:none; stroke:#4E666E; stroke-width:2; marker-start:url(#arrow); marker-end:url(#arrow)}
    </style>
  </defs>

