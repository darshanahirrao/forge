name: Check Forge
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - name: Install the public archive in an empty directory
        run: npm run test:distribution
      - name: Native memory pressure admission
        run: npm run test:native:pressure
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Native idle resource trace
        run: npm run test:native:resources
  release:
    if: startsWith(github.ref, 'refs/tags/forge-v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run release:pack
      - name: Publish the checked public alpha archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FORGE_RELEASE_VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "forge-v${FORGE_RELEASE_VERSION}"
          gh release create "$GITHUB_REF_NAME" artifacts/releases/*.tgz artifacts/releases/SHA256SUMS \
            --verify-tag --prerelease --latest=false \
            --title "Forge ${FORGE_RELEASE_VERSION} public alpha" \
            --notes-file docs/RELEASE_NOTES.md
